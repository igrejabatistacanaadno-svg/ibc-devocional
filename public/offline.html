<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBC Devocional — Sem conexão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0d2655;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
      letter-spacing: -.5px;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .5rem; }
    p { color: rgba(255,255,255,.6); font-size: .9rem; line-height: 1.6; max-width: 280px; }
    button {
      margin-top: 1.5rem;
      background: #f0b429; color: #0d2655;
      border: none; border-radius: 12px;
      padding: .75rem 1.5rem;
      font-weight: 700; font-size: .9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">IBC</div>
  <h1>Você está offline</h1>
  <p>Verifique sua conexão com a internet para acessar as devocionais mais recentes.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
