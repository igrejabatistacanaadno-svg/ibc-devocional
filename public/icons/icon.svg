<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B00"/>
      <stop offset="35%"  stop-color="#FF3D6E"/>
      <stop offset="65%"  stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="25%"  stop-color="#e8e8e8"/>
      <stop offset="50%"  stop-color="#c0c8d8"/>
      <stop offset="75%"  stop-color="#9aa8be"/>
      <stop offset="100%" stop-color="#d4dce8"/>
    </linearGradient>
    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0e8f4"/>
      <stop offset="100%" stop-color="#a0aec0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ringGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.7)"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.4" filter="url(#ringGlow)"/>
  <!-- Main gradient ring border -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="14" filter="url(#ringGlow)"/>
  <!-- Inner ring highlight -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Dark circle background -->
  <circle cx="256" cy="256" r="234" fill="url(#bgGrad)"/>
  <!-- Subtle inner glow at top -->
  <ellipse cx="256" cy="150" rx="130" ry="70" fill="rgba(100,130,200,0.06)"/>

  <!-- BIBLE - left page -->
  <path d="M 108 285 Q 150 268 252 275 L 252 362 Q 150 356 108 372 Z" fill="#2a3a52" stroke="#4a5a72" stroke-width="1.5"/>
  <line x1="130" y1="298" x2="240" y2="291" stroke="rgba(150,170,200,0.3)" stroke-width="1.5"/>
  <line x1="128" y1="311" x2="240" y2="305" stroke="rgba(150,170,200,0.25)" stroke-width="1.5"/>
  <line x1="127" y1="324" x2="240" y2="318" stroke="rgba(150,170,200,0.2)" stroke-width="1.5"/>
  <line x1="126" y1="337" x2="240" y2="331" stroke="rgba(150,170,200,0.15)" stroke-width="1.5"/>
  <!-- BIBLE - right page -->
  <path d="M 404 285 Q 362 268 260 275 L 260 362 Q 362 356 404 372 Z" fill="#2a3a52" stroke="#4a5a72" stroke-width="1.5"/>
  <line x1="380" y1="298" x2="272" y2="291" stroke="rgba(150,170,200,0.3)" stroke-width="1.5"/>
  <line x1="382" y1="311" x2="272" y2="305" stroke="rgba(150,170,200,0.25)" stroke-width="1.5"/>
  <line x1="383" y1="324" x2="272" y2="318" stroke="rgba(150,170,200,0.2)" stroke-width="1.5"/>
  <line x1="384" y1="337" x2="272" y2="331" stroke="rgba(150,170,200,0.15)" stroke-width="1.5"/>
  <!-- Book spine -->
  <rect x="252" y="274" width="8" height="90" rx="2" fill="#6a7a90"/>
  <!-- Book shine -->
  <path d="M 108 285 Q 150 268 252 275 L 252 281 Q 150 274 110 290 Z" fill="rgba(200,220,255,0.18)"/>
  <path d="M 404 285 Q 362 268 260 275 L 260 281 Q 362 274 402 290 Z" fill="rgba(200,220,255,0.18)"/>

  <!-- HEART -->
  <path d="M 256 218 C 256 218 216 182 203 170 C 188 156 170 162 163 177 C 156 192 165 210 178 218 C 191 226 256 258 256 258 C 256 258 321 226 334 218 C 347 210 356 192 349 177 C 342 162 324 156 309 170 C 296 182 256 218 256 218 Z"
        fill="url(#silverGrad)" filter="url(#shadow)"/>
  <!-- Heart shine -->
  <path d="M 220 186 C 210 172 196 164 190 172 C 198 162 214 158 228 172 C 238 182 250 200 256 218 C 248 204 232 192 220 186 Z"
        fill="rgba(255,255,255,0.38)"/>

  <!-- CROSS -->
  <rect x="248" y="126" width="16" height="66" rx="4" fill="url(#silverGrad)" filter="url(#shadow)"/>
  <rect x="224" y="144" width="64" height="16" rx="4" fill="url(#silverGrad)" filter="url(#shadow)"/>
  <!-- Cross shine -->
  <rect x="248" y="126" width="8" height="33" rx="4" fill="rgba(255,255,255,0.42)"/>
  <rect x="224" y="144" width="32" height="8" rx="4" fill="rgba(255,255,255,0.42)"/>

  <!-- IBC 3D shadow -->
  <text x="260" y="316" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="112" font-style="italic" fill="rgba(0,0,0,0.45)" letter-spacing="-2">IBC</text>
  <!-- IBC main text -->
  <text x="256" y="312" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="112" font-style="italic" fill="url(#silverGrad)" filter="url(#glow)" letter-spacing="-2">IBC</text>

  <!-- Divider -->
  <line x1="135" y1="326" x2="377" y2="326" stroke="url(#silverGrad2)" stroke-width="1.5" opacity="0.65"/>

  <!-- CANAÃ -->
  <text x="256" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="url(#silverGrad2)" letter-spacing="6">CANAÃ</text>

  <!-- IGREJA BATISTA -->
  <text x="256" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="rgba(180,200,230,0.72)" letter-spacing="4">IGREJA BATISTA</text>

  <!-- Top ring shine -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.55"/>
</svg>
